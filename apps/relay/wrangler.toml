name = "agentcomms-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "node scripts/prepare-sodium.mjs"

[alias]
"libsodium-sumo" = "./src/sodium-worker.ts"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
