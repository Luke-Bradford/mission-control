operator:
  github_logins: [] # GitHub logins FLIGHT may assign on superuser repos
  # The operator's id (default "operator").
  id: operator
  timezone: UTC

accounts:
  - id: claude-main
    vendor: claude
    alert_at: 85
    stop_at: 95
  - id: codex-main
    vendor: codex
    alert_at: 70
    stop_at: 80

# Each repo's `project` is a GitHub Project owned by a user account; organisation-owned Projects are not supported.
repos:
  - id: shop-app
    github: octo-org/shop-app
    # Repo rules live here; no Mission Control file is needed in the target repo.
    # An optional CLAUDE.md Mission Control block tightens safety rules; user templates,
    # promote_backlog and needs win. The block may set pick_from/areas and fill omitted keys.
    # Set an explicit hard_rules list before enabling merges; [] explicitly means no paths.
    # rules:
    #   pick_from: [Todo]
    #   promote_backlog: false
    #   needs: [done_when, size]
    #   templates: {bug: bugfix, chore: small-change}
    #   areas: {"area:app": ["src/**"]}
    #   hard_rules: ["policy/**"]
    #   hard_rules_by: operator
    #   always_ask: []
    # Commands and protected files are user-config keys alongside rules. commands are the repo's
    # validation commands, named in each seat's brief; they are not an allowlist (seats run ordinary
    # local commands inside their sandbox).
    # commands:
    #   writer: ["uv run pytest"]
    #   review: ["uv run pytest"]
    # protected: ["pyproject.toml", "uv.lock", "uv.toml", "conftest.py", "setup.cfg"]
    project: 2
    # autonomy: draft
    # flight_powers: standard   # standard (default) | superuser. superuser raises FLIGHT's powers on this repo (docs/superpowers/specs/2026-10-23-flight-superuser-design.md). Only the user config sets it. A change applies live and restarts FLIGHT.
    status_map:
      Todo: planned
      In Progress: in progress
      In Review: review
      Blocked: blocked
      Done: done
  - id: site-builder
    github: octo-org/site-builder
    project: 3
    # autonomy: draft
    # flight_powers: standard   # standard (default) | superuser. superuser raises FLIGHT's powers on this repo (docs/superpowers/specs/2026-10-23-flight-superuser-design.md). Only the user config sets it. A change applies live and restarts FLIGHT.
    status_map:
      Backlog: planned
      Ready: planned
      In progress: in progress
      In review: review
      Blocking: blocked
      Done: done
  # Mission Control itself: the first crew's repo (Setup › Repos adds it with your project's number).
  # Placeholder: no Mission Control project exists yet; use its number once it is created.
  - id: mission-control
    github: octo-org/mission-control
    # Operator migration: copy this repo's CLAUDE.md mc: mapping into rules: here in your
    # ~/.config/mission-control/config.yaml, omitting the unused ci key. Keep the full hard_rules
    # list. The existing repo block remains an optional override that tightens rules until separately removed.
    # See docs/runbook.md, Per-repo board rules. This example does not edit your home config.
    project: 5
    # Commands that run the whole suite: each takes the shared test lock, so one seat at a time runs
    # one. Each must be one of the repo's writer validation commands (commands.writer, or the
    # defaults) or extend one; it is not an allowlist of what seats may run.
    full_suite:
      - pnpm -s test
      - pnpm -s vitest run
      - pnpm -s vitest
    # autonomy: draft (the default) — Mission Control never moves this repo's cards. Set
    # `autonomy: merge` to let the build loop move a run's own card In progress / In review /
    # Blocked; merge needs a crew session for this repo, or the config fails to load.
    # flight_powers: standard   # standard (default) | superuser. superuser raises FLIGHT's powers on this repo (docs/superpowers/specs/2026-10-23-flight-superuser-design.md). Only the user config sets it. A change applies live and restarts FLIGHT.
    status_map:
      Todo: planned
      In Progress: in progress
      In Review: review
      Blocked: blocked
      Done: done

loops:
  - id: shop-app-ta
    repo_id: shop-app
    kind: ta-loop
    account_id: claude-main
    state_dir: ~/code/.shop-app-autonomy/var/autonomy
    worktree: ~/code/.shop-app-autonomy
    launchd_label: com.shop-app.ta-loop
  - id: studio-builder
    repo_id: site-builder
    kind: studio-loop
    account_id: claude-main
    logs_dir: ~/code/studio-loop/logs
    state_dir: ~/code/studio-loop
    worktree: ~/code/studio-loop-repo
    launchd_label: com.site-builder.studio-build-driver

poll:
  usage_minutes: 30
  github_seconds: 60
  # Minutes between periodic reads of the GitHub boards (5–60, default 15). The boards are also
  # read when work is picked up, right after the hub changes GitHub, and on the HUD's Refresh.
  board_minutes: 15

# Optional: Mission Control's own crew. Each session is a repo cloned for the crew (never your
# working checkout) and the seats that work in it. GUIDO and INCO write inside their `area`
# (globs; writer areas in a session must not overlap); RETRO is read-only and takes no area.
# `worktrees` and every `checkout` must lie outside the hub's checkout and every loop's paths, and a
# `checkout` must be a clone of its own, never a worktree of the hub's or a loop's repository.
crew:
  worktrees: ~/code/mc-crew/worktrees
  max_seats: 8
  # The node the guard hook runs under: a stable path (never a Cellar path), an executable file.
  # Default /opt/homebrew/bin/node.
  # node: /opt/homebrew/bin/node
  # Folders code the seats run may not read, on top of the credential folders, the hub's checkout,
  # every loop's folders and the other sessions' checkouts, which are always denied. List your own
  # working folders. Absolute paths (~ allowed); none may be, hold or lie inside `worktrees`, a
  # `checkout` or a temp dir (the hub's, or /tmp).
  # deny_read: [~/code/work, ~/Documents]
  # Input + output tokens one build-loop run may use (the engine will park a run that goes over).
  # Default 400000.
  # run_token_budget: 400000
  # Unfinished runs (set aside in CI or review) a writer seat may hold before it takes no new ticket.
  # Default 2.
  # max_open_runs_per_seat: 2
  # Start only cards labelled `lane:<lane>` (home or work); unset: any card, as before lanes.
  # lane_default: true also starts cards with no lane label; set it on one hub only.
  # lane: home
  # lane_default: true
  sessions:
    - id: mission-control
      repo_id: mission-control
      checkout: ~/code/mc-crew/mission-control
      seats:
        - { id: guido-1, role: GUIDO, account_id: claude-main, model: sonnet, area: ["apps/server/**", "packages/core/**"] }
        - { id: inco-1, role: INCO, account_id: claude-main, model: sonnet, area: ["apps/web/**"] }
        # A review seat (mode: scratch) may set light_model: the model for small changes (Size XS or S, or a chore, test or docs ticket).
        - { id: retro-1, role: RETRO, account_id: claude-main, model: opus }
