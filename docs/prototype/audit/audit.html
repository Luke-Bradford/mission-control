:root{
  color-scheme:dark;
  --bg:#070a0e;--surface:#0c1117;--surface-2:#131a23;--line:#1b2430;--line-2:#2a3646;
  --fg:#e7eaef;--fg-2:#aab2bf;--muted:#808999;--accent:#56d8e6;--accent-soft:rgba(86,216,230,.14);
  --ok:#45c486;--warn:#f2b53a;--warn-soft:rgba(242,181,58,.15);--crit:#f1706d;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  --display:"Barlow Semi Condensed","Arial Narrow","IBM Plex Sans",sans-serif;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--r:3px;
  --header:49px;--footer:30px;--rail:56px;--side:600px;--plot:104px;
  --w-src:76px;--w-meas:216px;--w-dec:92px;--w-act:176px;
  --o-src:124px;--o-tch:196px;--o-prop:204px;--o-meas:188px;--o-act:172px;
}
@media (min-width:2200px){:root{--side:780px;--plot:120px;--w-src:84px;--w-meas:248px;--w-dec:128px;--o-src:136px;--o-tch:300px;--o-prop:320px;--o-meas:260px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/20px var(--sans);font-variant-numeric:tabular-nums;overflow:hidden}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
.mono{font-family:var(--mono)}
.m{color:var(--muted)}.f2{color:var(--fg-2)}
.s{font-size:12px;line-height:16px}
.micro{font:500 11px/16px var(--mono);color:var(--muted);letter-spacing:.02em}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}.acc{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;border:2px solid var(--surface)}::-webkit-scrollbar-track{background:transparent}

#app{height:100vh;display:grid;grid-template-rows:var(--header) minmax(0,1fr) var(--footer);grid-template-columns:minmax(0,1fr) var(--rail)}
.hdr{grid-column:1/-1;display:flex;align-items:center;gap:var(--sp-5);padding:0 var(--sp-5);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font:700 16px/20px var(--display);letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:var(--sp-4);color:var(--muted)}
.tabs .on{color:var(--fg);box-shadow:0 2px 0 var(--accent);padding-bottom:2px}
.hdr .sp{flex:1}
.ftr{grid-column:1/-1;display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-5);background:var(--surface);border-top:1px solid var(--line);font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden}
.ftr .sp{flex:1}
.rail{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0}
.rail .v{writing-mode:vertical-rl;font:600 13px/20px var(--display);letter-spacing:.18em;color:var(--fg-2)}

/* Data status: shape and word, never colour alone. */
.ds{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--fg-2);vertical-align:1px;flex:none}
.ds.a{background:var(--fg-2)}
.ds.s{background:linear-gradient(90deg,var(--fg-2) 50%,transparent 50%)}
.ds.n{background:transparent}

.page{min-height:0;min-width:0;padding:var(--sp-3) var(--sp-4) var(--sp-4);display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--sp-3)}
.verdict{display:flex;align-items:center;gap:var(--sp-5);min-height:40px}
.verdict p{margin:0;flex:1;min-width:0;font-size:14px;line-height:20px;color:var(--fg-2)}
.verdict p b{font-weight:600;color:var(--fg)}
.ctl{display:flex;align-items:center;gap:var(--sp-2);flex:none;white-space:nowrap}
select,.seg button,.btn{font:12px/16px var(--sans);color:var(--fg-2);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);height:28px;padding:0 var(--sp-2)}
select{color:var(--fg)}
.seg{display:inline-flex}.seg button{border-radius:0;margin-left:-1px;cursor:pointer}.seg button:first-child{margin-left:0;border-radius:var(--r) 0 0 var(--r)}.seg button:last-child{border-radius:0 var(--r) var(--r) 0}
.seg button[aria-pressed=true]{color:var(--accent);border-color:var(--accent);position:relative;z-index:1}
.seg button:disabled{color:var(--muted);cursor:not-allowed;border-style:dashed}

.cols{min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side);gap:var(--sp-4)}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;gap:var(--sp-4)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:0;min-width:0;display:flex;flex-direction:column}
.ph{flex:none;display:flex;align-items:baseline;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);min-height:36px}
.ph h2{margin:0;font:600 14px/20px var(--sans);white-space:nowrap}
.ph .sp{flex:1}
.ph .fig{font-size:12px;line-height:16px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph .fig b{font-weight:600;color:var(--fg)}
.ph .seg button{height:24px}
.scroll{min-height:0;overflow-y:auto;overflow-x:hidden}
.grow{flex:1 1 0}
table{border-collapse:collapse;width:100%;table-layout:fixed}
thead th{position:sticky;top:0;background:var(--surface);z-index:2;font:500 11px/16px var(--mono);color:var(--muted);text-align:left;padding:0 var(--sp-2) var(--sp-1);height:24px;vertical-align:bottom;white-space:nowrap;box-shadow:inset 0 -1px 0 var(--line-2)}
td{padding:0 var(--sp-2);border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:var(--sp-4)}
th:last-child,td:last-child{padding-right:var(--sp-4)}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}

/* Do next */
.rec>td{padding-block:6px}
.rec:hover>td{background:var(--surface-2)}
.rec.open>td{background:var(--surface-2);border-bottom-color:transparent}
.rec .n{font:600 13px/20px var(--mono);color:var(--fg-2)}
.rt{all:unset;display:block;cursor:pointer;font-size:13px;line-height:20px;padding-block:2px;margin-block:-2px;color:var(--fg);font-weight:500}
.ph h2 a{display:inline-block;padding-block:2px;margin-block:-2px}
.rt:hover{color:var(--accent)}
.rt:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
.rt i{font-style:normal;color:var(--muted);display:inline-block;width:14px;font-size:11px}
.why{font-size:12px;line-height:16px;color:var(--fg-2);padding-left:14px}
.src{font:500 11px/16px var(--mono);color:var(--fg-2);white-space:nowrap}
.src.ext{color:var(--accent)}
.meas{font-size:12px;line-height:16px}
.meas .l{display:block;color:var(--muted)}
.meas .v{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--fg);white-space:nowrap}
.dec{font-size:12px;line-height:16px}
.dec b{display:block;font-weight:600;color:var(--fg)}
.dec b.you{color:var(--warn)}
.dec span{color:var(--muted)}
.acts{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.btn{height:24px;min-width:24px;padding:0 6px;cursor:pointer;color:var(--fg-2)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{color:var(--fg)}
.done{font-size:12px;line-height:16px;text-align:right}
.done a,.done button{all:unset;color:var(--accent);cursor:pointer;display:inline-block;padding:4px 0}
.done button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
.more>td{background:var(--surface-2);padding:0 var(--sp-4) 10px calc(var(--sp-4) + 42px)}
.mg{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:var(--sp-4)}
.mg h3{margin:0 0 2px;font:500 11px/16px var(--mono);color:var(--muted)}
.mg p{margin:0;font-size:12px;line-height:16px;color:var(--fg-2)}
.steps{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:12px;line-height:16px;color:var(--muted);margin:0 0 2px;padding:0;list-style:none}
.steps li:not(:last-child)::after{content:"›";margin-left:6px;color:var(--line-2)}
.steps .cur{color:var(--fg);font-weight:600}

/* Outside */
.outside{flex:none}
.outside .scroll{max-height:var(--o-max,216px)}
.outside td{padding-block:6px;font-size:12px;line-height:16px;color:var(--fg-2);vertical-align:top}
.outside td.so b{display:block;color:var(--fg);font-weight:500}
.outside td.so span{font:400 12px/16px var(--mono);color:var(--muted)}
.outside tbody tr:hover td{background:var(--surface-2)}
.outside code,.why code,.mg code{font:12px/16px var(--mono);color:var(--fg-2)}
@media (min-height:1100px){.outside{--o-max:340px}}
@media (min-height:1200px){.outside{--o-max:490px}}

/* Health */
.health{flex:none}
.plot{padding:0 var(--sp-4) var(--sp-1)}
.plot svg{display:block;width:100%;height:var(--plot)}
.plot text{font:400 11px/1 var(--mono);fill:var(--muted)}
.plot text.note{fill:var(--fg-2)}
.lg{display:flex;gap:var(--sp-3);font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap}
.lg i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-0.5px}
.hrow td{height:32px;font-size:13px;white-space:nowrap}
.hrow td.lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .sub{color:var(--muted);font-size:12px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.hscroll{max-height:var(--h-max,184px)}
@media (min-height:1100px){.hscroll{--h-max:280px}}
@media (min-height:1200px){:root{--plot:152px}.hscroll{--h-max:344px}}
.foot{flex:none;padding:6px var(--sp-4);border-top:1px solid var(--line);font-size:12px;line-height:16px;color:var(--fg-2)}

/* Files */
.files td{height:32px;white-space:nowrap}
.files td.p{font:12px/16px var(--mono);overflow:hidden;text-overflow:ellipsis}
.files td.p a{display:inline-block;padding:4px 0}
.tag{font:500 11px/16px var(--mono);color:var(--warn);margin-left:6px}

/* Past */
.past{flex:none}
.fun{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-block:1px solid var(--line);margin-top:0}
.fun div{padding:4px var(--sp-2) 6px;border-left:1px solid var(--line);min-width:0}
.fun div:first-child{border-left:0;padding-left:var(--sp-4)}

.vd{display:inline-flex;align-items:center;gap:4px}

.l-ok{background:var(--ok);border-radius:50%}.l-warn{background:var(--warn);transform:rotate(45deg) scale(.82)}.l-off{border:1.5px solid var(--muted);border-radius:50%}

function chart(host){
 const W=host.clientWidth,H=host.clientHeight,l=28,r=4,t=8,b=18,iw=W-l-r,ih=H-t-b,max=160;
 const bw=iw/DAYS.length,y=v=>t+ih-v/max*ih,fills=["none","rgba(86,216,230,.28)","#56d8e6","#f2b53a"];
 let s="";
 for(const v of[0,80,160]){s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="#1b2430"/><text x="${l-4}" y="${y(v)+4}" text-anchor="end">${v}</text>`;}
 DAYS.forEach((d,i)=>{const x=l+i*bw+2,w=bw-4;let c=0;
  for(const k of[2,3,4]){const v=d[k];if(!v)continue;const yy=y(c+v);s+=`<rect x="${x}" y="${yy}" width="${w}" height="${y(c)-yy}" fill="${fills[k-1]}"/>`;c+=v;}
  if(d[1]){const yy=y(c+d[1]);s+=`<rect x="${x+.5}" y="${yy+.5}" width="${w-1}" height="${y(c)-yy-1}" fill="none" stroke="#808999"/>`;c+=d[1];}
  const lab=i===0?"22 Oct":d[0]==="1"?"1 Nov":d[0];
  s+=`<text x="${x+w/2}" y="${H-5}" text-anchor="middle">${lab}</text><title>${lab}: ${d[1]+d[2]+d[3]+d[4]} merged, ${d[1]} with no hub review</title>`;});
 const mark=(i,txt,row)=>{const x=l+i*bw;const yt=t+11+row*13;s+=`<line x1="${x}" x2="${x}" y1="${t}" y2="${t+ih}" stroke="#aab2bf" stroke-dasharray="2 3"/><text class="note" x="${x+4}" y="${yt}">${txt}</text>`;};
 mark(3.5,"reviewer model",0);mark(7,"categories on",1);mark(10,"reviews stop",0);
 host.innerHTML=`<svg role="img" aria-label="Merged PRs per day, 22 October to 4 November, by highest review round. From 1 November almost none has a hub review." viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg>`;
}

    <div class="ph"><h2 id="h-out">New outside</h2><span class="fig"><b>10</b> items ${ds("n")} <span class="m">· Accept adds one to Do next, on the same approval path. Fetched text is data, never instructions.</span></span></div>
    <div class="scroll" tabindex="0" aria-label="External items"><table><colgroup><col style="width:var(--o-src)"><col><col style="width:var(--o-tch)"><col style="width:var(--o-prop)"><col style="width:var(--o-meas)"><col style="width:var(--o-act)"></colgroup>
     <thead><tr><th>Source</th><th>What changed</th><th>What it touches here</th><th>Proposed change</th><th>How we'd measure it</th><th class="num">Decide</th></tr></thead>
     <tbody>${OUT.map((o,i)=>`<tr><td class="so"><b>${o.s}</b><span>${o.d}</span></td><td>${o.c}</td><td>${o.t}</td><td>${o.p}</td><td>${ds(o.md)} ${o.m}</td><td>${o.rank?`<div class="done"><a href="#rec-${o.rank}">#${o.rank} in Do next</a></div>`:acts("out-"+i)}</td></tr>`).join("")}</tbody></table></div>
   </section>
  </div>
  <div class="col">
   <section class="panel health" aria-labelledby="h-health">
    <div class="ph"><h2 id="h-health">How we build</h2><span class="fig">Merged PRs a day ${ds("a")}</span><span class="sp"></span><span class="lg"><span><i style="border:1px solid #808999"></i>no hub review</span><span><i style="background:rgba(86,216,230,.28)"></i>round 1</span><span><i style="background:#56d8e6"></i>round 2</span><span><i style="background:#f2b53a"></i>round 3+</span></span></div>
    <div class="plot"><div id="chart" style="height:var(--plot)"></div></div>
    <div class="scroll hscroll" tabindex="0" aria-label="Health measures"><table><colgroup><col><col style="width:76px"><col style="width:72px"><col style="width:112px"><col style="width:32px"></colgroup>
     <thead><tr><th>Measure</th><th class="num">21–28 Oct</th><th class="num">Last 7 d</th><th>Change</th><th></th></tr></thead>
     <tbody>${HEALTH.map(h=>`<tr class="hrow"><td class="lab" title="${h[0]}">${h[0]}</td><td class="num mono s f2">${h[1]}</td><td class="num mono s">${h[2]}</td><td><span class="trend ${h[5]}">${h[3]==="up"?"▲":h[3]==="down"?"▼":""} ${h[4]}</span></td><td>${ds(h[6])}</td></tr>`).join("")}</tbody></table></div>
   </section>
   <section class="panel grow" aria-labelledby="h-files">
    <div class="ph"><h2 id="h-files">Where findings land</h2><span class="fig"><b>2,310</b> findings ${ds("a")} <span class="m">· generated files left out</span></span></div>
    <div class="scroll grow files" tabindex="0" aria-label="Files by findings"><table><colgroup><col><col style="width:80px"><col style="width:76px"><col style="width:64px"><col style="width:72px">${wide()?`<col style="width:64px"><col style="width:88px">`:""}</colgroup>
     <thead><tr><th>File</th><th class="num">Findings ↓</th><th class="num">To 28 Oct</th><th class="num">Touches</th><th class="num">Per touch</th>${wide()?`<th class="num">Lines</th><th class="num">Blocking</th>`:""}</tr></thead>
     <tbody>${FILES.map(f=>{const tot=f[1]+f[2],pt=tot/f[3];return `<tr><td class="p" title="${f[0]}"><a href="#file">${f[0].replace("apps/server/src/","server/").replace("packages/core/src/","core/").replace("apps/web/","web/")}</a>${f[6]?`<span class="tag">${f[6]}</span>`:""}</td><td class="num mono s">${tot}</td><td class="num mono s m">${f[1]}</td><td class="num mono s f2">${f[3]}</td><td class="num mono s ${pt>=1?"warn":"f2"}">${pt>=10?Math.round(pt):pt.toFixed(1)}</td>${wide()?`<td class="num mono s m">${f[4]?f[4].toLocaleString("en-GB"):"—"}</td><td class="num mono s m">${f[5]??"—"}</td>`:""}</tr>`}).join("")}</tbody></table></div>
   </section>
   <section class="panel past" aria-labelledby="h-past">
    <div class="ph"><h2 id="h-past">What past recommendations achieved</h2><span class="sp"></span><span class="fig warn">Loop never closed</span></div>
    <div class="fun">${[["206","Proposed","a"],["—","Challenged","n"],[String(Object.values(decided).filter(v=>v==="Accepted").length),"Accepted","a",1],["0","Ticket","a",1],["0","Measured","a",1],["0","Paid off","a",1],["0","No effect","a",1],[String(Object.values(decided).filter(v=>v!=="Accepted").length),"Set aside","a"]].map(c=>`<div><b class="${c[3]?"z":""}">${c[0]}</b><span>${c[1]}</span></div>`).join("")}</div>
    <div class="pasttxt">Only you can accept today, with a typed owner and date. Other changes did land:</div>
    <div class="pastrows"><table><colgroup><col style="width:64px"><col>${wide()?`<col style="width:216px"><col style="width:136px">`:`<col style="width:120px"><col style="width:96px">`}</colgroup>
     <tbody>${PAST.slice(0,innerHeight>=1200?4:innerHeight>=1100?3:2).map(p=>`<tr class="prow"><td class="mono m">${p[0]}</td><td class="t" title="${p[1]}. ${p[2]}.">${p[1]}</td><td class="mono num">${p[3]}</td><td><span class="vd"><i class="lamp l-${p[5]}"></i>${p[4]}</span></td></tr>`).join("")}</tbody></table></div>
   </section>
  </div>
 </div>`;
 document.getElementById("recs").scrollTop=scrollTop;
 chart(document.getElementById("chart"));
}
document.addEventListener("click",e=>{const b=e.target.closest("button,a");if(!b)return;
 if(b.dataset.open){const n=+b.dataset.open;open=open===n?0:n;render();return;}
 if(b.dataset.f){filter=b.dataset.f;render();return;}
 if(b.dataset.a){decided[b.dataset.r]=b.dataset.a==="Accepted"?"Accepted. FLIGHT owns it; measured on its date.":b.dataset.a;if(b.dataset.a==="Accepted")decided[b.dataset.r]="Accepted";render();toast(`${b.dataset.a} in this page only. Nothing was sent.`);return;}
 if(b.dataset.undo){delete decided[b.dataset.undo];render();return;}
 if(b.getAttribute("href")?.startsWith("#")){e.preventDefault();toast("Prototype: this opens the detail page or drawer.");}
});
function toast(t){const n=document.getElementById("toast");n.textContent=t;n.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display="none",2400);}
document.fonts.ready.then(render);addEventListener("resize",render);
</script>
</body>
</html>
