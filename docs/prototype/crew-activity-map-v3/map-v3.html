<!doctype html>
<html lang="en">
<head>

<title>Crew Activity Map</title>
<!--
  Crew Activity Map v3 mockup. One file; the only runtime fetch is D3 from cdnjs.

  Data: the hub's live map payload for mission-control (tree of 753 files, seats, findings,
  conflicts) is embedded verbatim except where noted:
  - Diffs are the real `gh pr diff` hunks for PR #816 and #806 (the active seats' current PRs) and
    also #809, #820 (inco-cx's other branches, #767 and #768) and #815 (guido-cx's #803 branch),
    because each seat's `scope.modified` spans all of its branches. Each file is cut at 110 rows.
  - Nine changed files are new on a branch and absent from the main-branch tree; they are added as
    tiles sized by their added lines.
  - SYNTHESISED TIMING: the payload's `recent` holds only 4 entries for inco-cx and 20 for
    guido-cx, all inside the last ~2.5 minutes. Every earlier tick on the session scrubber is
    synthesised from the seats' `scope.read` / `scope.modified` lists: folder listings first, then
    each older branch's files, then the current PR's files, a read shortly before each change of a
    file the seat also read, and a second change on about a third of files. Real `recent` entries
    keep their real timestamps; an entry counts as a change if the seat modified that file.
    The changed-file lists sort newest-first by these (partly synthesised) times.
  - Seat colours: the HUD indexes --s1..--s7 by the seat's config index; the payload's seat order
    is used as that index here (guido-cx = 7 -> --s1), except inco-cx, moved to --s2 (orange) so the two
    active seats don't read as one colour (the payload order would give it --s7 violet).
  - Seat areas come from the current tickets' labels (#776 area:web, #752 area:server).
  - Impact: the payload's 3,014 import edges. Imports of `@mc/core` (packages/core/src/index.ts, `export *`
    of every core file) are resolved to the core file that declares each imported name, so a web file
    depends on flight.ts only if it imports something flight.ts declares. File-level, not symbol-level:
    it does not yet check whether the other seat's diff touched the names used.
  - History: every PR merged to main since 22 Oct (390), from `git log --merges --first-parent`. A PR is
    a bug fix if its ticket has the `bug` label or its branch starts with fix/. Change together = both
    files in 4+ PRs and in at least half of the PRs of the less-changed one; PRs over 25 files skipped.
-->
<style>

  --ok: #157246; --warn: #8d5b00; --warn-mark: #c18b18; --warn-soft: rgba(224,162,28,.18);
  --crit: #bb2e2b; --crit-soft: rgba(196,48,45,.1);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --r1: #0e6a8a; --r2: #586018; --r3: #a2308f;
  --tile: #e2e7ee; --tile-off: #f1f3f6; --tile-ink: #3c4657; --tile-ink-off: #a3abb8;
  --folder: #ffffff; --folder-head: #f4f6f9; --hatch: #7d8696;
  --add: #157246; --add-bg: #e6f4ea; --add-strong: #c5e8cf;

}

    color-scheme: dark;
    --bg: #070a0e; --surface: #0c1117; --surface-2: #131a23; --line: #1b2430; --line-2: #2a3646;
    --fg: #e7eaef; --fg-2: #aab2bf; --muted: #808999;
    --accent: #56d8e6; --accent-soft: rgba(86,216,230,.14);
    --ok: #45c486; --warn: #f2b53a; --warn-mark: #f2b53a; --warn-soft: rgba(242,181,58,.15);
    --crit: #f1706d; --crit-soft: rgba(240,107,104,.15);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --r1: #3fd0e8; --r2: #e6dc6e; --r3: #f5b5d0;
    --tile: #1d2632; --tile-off: #10161e; --tile-ink: #b4bcc8; --tile-ink-off: #4f5968;
    --folder: #0c1117; --folder-head: #121922; --hatch: #8a94a5;
    --add: #45c486; --add-bg: #0f2a1d; --add-strong: #17432d;
    --rem: #f1706d; --rem-bg: #2e1414; --rem-strong: #4a1d1d;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: 48px minmax(0, 1fr); height: 100vh; min-width: 1280px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.top h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
.repo { font: 12px var(--mono); color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); border-radius: 3px; padding: 4px 8px; height: 28px; }
.stats { display: flex; align-items: center; gap: 0; color: var(--fg-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; min-width: 0; }
.stats span + span::before { content: "·"; color: var(--muted); padding: 0 8px; }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats .add { color: var(--add); } .stats .rem { color: var(--rem); }
.top .spacer { flex: 1; }
.top .asof { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* body */
.body { display: grid; grid-template-columns: minmax(0, 1fr) var(--pane-w); min-height: 0; }
.mapcol { display: grid; grid-template-rows: 46px minmax(0, 1fr) auto; min-width: 0; min-height: 0; padding: 0 12px 12px 16px; }
.toolbar { display: flex; align-items: center; gap: 14px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; background: var(--surface); flex: none; }
.seg button { border: 0; background: none; padding: 5px 12px; font-size: 12.5px; cursor: pointer; color: var(--fg-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.seg button:not([aria-pressed="true"]):hover { background: var(--surface-2); color: var(--fg); }
.caption { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; min-width: 0; flex: 1; }
.caption b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.key { display: inline-flex; align-items: center; gap: 5px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 1px; vertical-align: -1px; }
.sw.ol { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.sw.hatch { background: repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 4px), var(--tile); }

.crew { display: flex; align-items: center; gap: 12px; flex: none; font-size: 12px; position: relative; }
.chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip i, .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.callsign { font: 600 11.5px var(--mono); letter-spacing: .02em; }

.idle[open] summary { background: var(--surface-2); color: var(--fg); }
.idle .pop { position: absolute; right: 0; top: 30px; width: 420px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 4px; box-shadow: 0 8px 24px rgba(20,30,50,.14); z-index: 20; padding: 6px 0; }

.idle .pop .ir .st { color: var(--muted); }
.idle .pop .ir .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-2); }
.idle .pop .ph { padding: 4px 12px 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

.tile.link { cursor: pointer; }

.tip .p { font: 11.5px var(--mono); word-break: break-all; color: var(--fg); }

.winbadge button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }

.scrub .ctl .note { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.scrub .ctl .ttl { font-weight: 600; color: var(--fg); }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 4px; padding: 2px 10px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 24px; }
.btn:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .45; cursor: default; }
.scrub .note { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
#lanes { display: block; width: 100%; }
#lanes text { font: 11px var(--sans); fill: var(--muted); }
#lanes .lab { font: 600 11px var(--mono); cursor: pointer; }
#lanes .lab.sel { text-decoration: underline; text-underline-offset: 3px; }
#lanes .selection { fill: var(--accent); fill-opacity: .1; stroke: var(--accent); stroke-width: 1; shape-rendering: crispEdges; }
#lanes .handle { fill: var(--accent); }

/* pane */
.pane { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; min-width: 0; }

.pane-scroll { flex: 1; overflow: auto; min-height: 0; }
.sec { border-bottom: 1px solid var(--line); }

.sh .l1 .ref a { color: inherit; text-decoration: none; }
.sh .ttl { margin-top: 3px; font-size: 12.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh .l3 { margin-top: 3px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh .l3 .add { color: var(--add); } .sh .l3 .rem { color: var(--rem); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto 44px 86px; gap: 8px; align-items: center; height: 26px; padding: 0 16px; cursor: pointer; font-size: 12px; }
.row:hover, .row.hl { background: var(--surface-2); }
.row.sel { background: var(--accent-soft); }
.row.out { opacity: .38; }
.row .fp { display: flex; min-width: 0; font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.row .fp .d { color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; direction: rtl; text-align: left; }
.row .fp .d bdi { direction: ltr; }
.row .fp .n { color: var(--fg); flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.row .tag { font-size: 10.5px; color: var(--fg-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; line-height: 15px; white-space: nowrap; }
.row .tag.new { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.row .tag.hr { color: var(--fg-2); }
.row .tags { display: flex; gap: 4px; justify-content: flex-end; }
.bar { display: flex; height: 6px; width: 44px; background: var(--surface-2); border-radius: 1px; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .a { background: var(--add); } .bar .r { background: var(--rem); }
.nums { font: 11px var(--mono); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.nums .add { color: var(--add); } .nums .rem { color: var(--rem); }
.readrow { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 16px; color: var(--fg-2); font-size: 12px; cursor: pointer; user-select: none; }
.readrow:hover { background: var(--surface-2); }
.readrow .car { width: 10px; color: var(--muted); }
.readlist .row { grid-template-columns: minmax(0, 1fr) auto; color: var(--fg-2); }
.readlist .row .fp .n { color: var(--fg-2); }
.grp { padding: 8px 16px 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; gap: 8px; }
.grp .c { margin-left: auto; text-transform: none; letter-spacing: 0; }

/* diff */
.dv { padding: 0 0 16px; }
.dv-top { position: sticky; top: 0; background: var(--surface); z-index: 2; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.back { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
.dv-path { margin-top: 6px; font: 12px var(--mono); word-break: break-all; color: var(--muted); }
.dv-path b { color: var(--fg); font-weight: 600; }
.dv-meta { margin-top: 4px; font-size: 12px; color: var(--fg-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.dv-meta .add { color: var(--add); } .dv-meta .rem { color: var(--rem); }
.dv-pr { padding: 10px 16px 6px; font-size: 11.5px; color: var(--fg-2); }
.dv-pr { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-pr code { font: 11px var(--mono); color: var(--muted); }
.diffbox { overflow-x: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
table.diff { border-collapse: collapse; font: 11.5px/18px var(--mono); min-width: 100%; width: max-content; }
table.diff td { padding: 0 8px 0 0; white-space: pre; vertical-align: top; }
table.diff td.ln { width: 36px; min-width: 36px; text-align: right; color: var(--muted); padding: 0 6px; user-select: none; font-size: 10.5px; }
table.diff tr.a td { background: var(--add-bg); } table.diff tr.a td.ln { background: var(--add-strong); color: var(--add); }
table.diff tr.r td { background: var(--rem-bg); } table.diff tr.r td.ln { background: var(--rem-strong); color: var(--rem); }
table.diff tr.h td { background: var(--surface-2); color: var(--muted); padding-top: 2px; padding-bottom: 2px; }
table.diff td.sg { width: 14px; padding: 0 2px 0 4px; color: var(--muted); }
table.diff tr.a td.sg { color: var(--add); } table.diff tr.r td.sg { color: var(--rem); }
.more { padding: 6px 16px; font-size: 12px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }

/* lens panes */
.item { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover, .item.hl { background: var(--surface-2); }
.item .ip { font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ip b { color: var(--fg); font-weight: 600; }
.fd { display: grid; grid-template-columns: 72px 1fr; gap: 8px; margin-top: 6px; font-size: 12px; }
.sev { font-size: 10.5px; font-weight: 600; border-radius: 3px; padding: 1px 5px; text-align: center; height: 17px; line-height: 15px; white-space: nowrap; }
.sev.Critical { color: var(--crit); background: var(--crit-soft); }
.sev.Important { color: var(--warn); background: var(--warn-soft); }
.sev.Minor { color: var(--fg-2); background: var(--surface-2); }
.fd .s { color: var(--fg); line-height: 1.4; }
.fd .w { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.br { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.br div { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 8px; font-size: 12px; align-items: center; }
.br .num { font-variant-numeric: tabular-nums; color: var(--fg-2); }
.br code { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.atable { width: 100%; border-collapse: collapse; font-size: 12px; }

.atable th:first-child, .atable td:first-child { padding-left: 16px; }
.atable th:last-child, .atable td:last-child { padding-right: 16px; }
.atable td.num, .atable th.num { text-align: right; }

.cov { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.cov .big { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cov .big span { font-size: 13px; font-weight: 400; color: var(--fg-2); }

  }
  return out;
}
function startPlay(stopAt) {
  stopPlay();
  const seq = seqFor(state.playSeat);
  state.play = { seat: state.playSeat, seq, i: 0, shown: new Set(), num: new Map() };
  document.getElementById("play").textContent = "■ Stop";
  const tick = () => {
    const p = state.play; if (!p) return;
    const e = p.seq[p.i]; p.shown.add(e.file); p.num.set(e.file, p.i + 1);
    p.i++;
    d3.select("#playlabel").text(`${CALL(p.seat)} step ${p.i} of ${p.seq.length} · ${fmtTime(e.at)} · ${e.k === "c" ? "changed" : "read"} ${e.file.split("/").pop()}`);
    paint();
    if (p.i >= p.seq.length || (stopAt && p.i >= stopAt)) { p.timer = null; document.getElementById("play").textContent = "↺ Reset"; return; }
    p.timer = setTimeout(tick, 380);
  };
  if (stopAt) { while (state.play.i < Math.min(stopAt, seq.length) - 1) { const e = seq[state.play.i]; state.play.shown.add(e.file); state.play.num.set(e.file, state.play.i + 1); state.play.i++; } }
  tick();
}
function stopPlay() {
  if (state.play && state.play.timer) clearTimeout(state.play.timer);
  state.play = null; d3.select("#playlabel").text(""); document.getElementById("play").textContent = "▶ Play " + CALL(state.playSeat);
  gPlay.selectAll("*").remove(); paint();
}
document.getElementById("play").onclick = () => { if (state.play) stopPlay(); else startPlay(); };
function paintPlayhead() {
  const ph = lanes.select(".playhead");
  if (!state.play || !state.play.i || !x) { ph.style("display", "none"); return; }
  const e = state.play.seq[state.play.i - 1];
  ph.style("display", null).attr("x1", x(e.at)).attr("x2", x(e.at));
}
function paintPlay() {
  gPlay.selectAll("*").remove();
  paintPlayhead();
  if (!state.play) { gTiles.style("opacity", 1); return; }
  const p = state.play, s = SEATS.find((x) => x.seat === p.seat);
  const cur = p.seq[p.i - 1];
  for (const [file, num] of p.num) {
    const n = files.get(file).node; if (!n) continue;
    const cx = Math.min(Math.max((n.x0 + n.x1) / 2, n.x0 + 9), n.x1 + 2), cy = Math.min((n.y0 + n.y1) / 2, n.y0 + 20);
    const isCur = cur && cur.file === file;
    const r = num >= 10 ? 9 : 8;
    gPlay.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r).style("fill", isCur ? "var(--fg)" : "var(--surface)").style("stroke", seatColor(s)).style("stroke-width", 1.5);
    gPlay.append("text").attr("class", "t-num").attr("x", cx).attr("y", cy + 3.4).attr("text-anchor", "middle").style("fill", isCur ? "var(--surface)" : "var(--fg)").text(num);
  }
}

// ---------- boot ----------
function boot() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
  drawLanes(); layout(); caption(); renderPane();
  document.getElementById("play").textContent = "▶ Play " + CALL(state.playSeat);
  if (q.get("lens") && document.querySelector(`[data-lens="${CSS.escape(q.get("lens"))}"]`)) setLens(q.get("lens"));
  if (q.get("read")) { state.readOpen[q.get("read")] = true; renderPane(); }
  if (q.get("win")) { const [a, b] = q.get("win").split(",").map(Number); state.win = [NOW - a * 60000, NOW - b * 60000]; drawLanes(); onWin(); }
  if (q.get("play")) { state.playSeat = q.get("play"); drawLanes(); startPlay(Number(q.get("step")) || 0); }
  if (q.get("diff")) openDiff(q.get("diff"));
  if (q.get("focus") && files.has(q.get("focus"))) setFocus(q.get("focus"));
  document.addEventListener("keydown", (ev) => { if (ev.key !== "Escape") return; if (state.focus) setFocus(null); else if (state.diff) closeDiff(); });
  if (q.get("hover")) { state.hover = q.get("hover"); paintHl(); document.querySelectorAll(`[data-file="${CSS.escape(q.get("hover"))}"]`).forEach((r) => r.classList.add("hl")); }
}
boot();
// re-layout whenever the map's box changes size (window resize, scrubber height settling)
let lastSize = "";
new ResizeObserver(() => {
  const el = document.getElementById("mapwrap"), k = el.clientWidth + "x" + el.clientHeight;
  if (k !== lastSize) { lastSize = k; layout(); }
}).observe(document.getElementById("mapwrap"));
let lastLanes = 0;
new ResizeObserver(() => { const w = lanes.node().clientWidth; if (w !== lastLanes) { lastLanes = w; drawLanes(); } }).observe(lanes.node());
</script>
