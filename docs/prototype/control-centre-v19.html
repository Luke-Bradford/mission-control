<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Centre — prototype v19</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--bg2:#010409;--p:#161b22;--p2:#1c2129;--sel:#1c2a3d;--ln:#30363d;--ln2:#3d444d;--tx:#e6edf3;--dim:#b1bac4;--ft:#8b949e;
--bl:#4493f8;--gr:#3fb950;--am:#e3b341;--rd:#f85149;--pu:#a371f7;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',-apple-system,sans-serif;--dock:360px}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-color:#3d444d #0d1117}
html,body{height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 var(--sans);overflow:hidden}
.m{font-family:var(--mono)}
a{color:var(--bl);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.app{display:grid;grid-template-rows:40px auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) var(--dock);height:100vh;width:100vw;overflow:hidden}
.app.nodock{grid-template-columns:minmax(0,1fr) 0}
.app.nodock .dock{display:none}
/* header */
.hdr{grid-column:1/3;display:flex;align-items:stretch;border-bottom:1px solid var(--ln);background:var(--bg2);padding:0 12px;gap:2px;min-width:0}
.brand{display:flex;align-items:center;font:600 12.5px var(--mono);color:var(--dim);margin-right:8px;white-space:nowrap}
.tab{display:flex;align-items:center;gap:6px;padding:0 10px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx)}.tab.on{color:var(--tx);border-bottom-color:var(--bl)}
.tab .b{font:600 10.5px var(--mono);color:#0d1117;background:var(--am);border-radius:8px;padding:0 5px}
.tab .b.r{background:var(--rd);color:#fff}
.sp{flex:1}
.hstat{display:flex;align-items:center;gap:12px;font:12px var(--mono);color:var(--ft);min-width:0;overflow:hidden;white-space:nowrap;flex:0 1 auto}
.hstat b{color:var(--tx);font-weight:500}.hstat .bad{color:var(--rd)}
.nu{flex:none;display:flex;align-items:center;gap:6px;margin-left:10px;cursor:pointer;font:12px var(--mono);color:#0d1117;background:var(--am);border-radius:12px;padding:2px 10px;align-self:center;font-weight:600}
.nu.zero{background:transparent;color:var(--ft);border:1px solid var(--ln2);font-weight:400}
.clock{flex:none;font:12px var(--mono);color:var(--ft);align-self:center;margin-left:10px}
/* legend */
.legend{grid-column:1/3;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:4px 14px;border-bottom:1px solid var(--ln);background:var(--bg);font:11.5px var(--mono);color:var(--ft);white-space:nowrap}
.legend b{color:var(--dim);font-weight:500}
main{overflow:auto;padding:12px 14px 40px;border-right:1px solid var(--ln);min-width:0;scrollbar-gutter:stable}
.view{display:none}.view.on{display:block}
h2{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin:18px 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ft);font-size:12px}
h2 .r{margin-left:auto;display:flex;gap:6px;align-items:center}
h2.first{margin-top:0}
.fresh{font:11px var(--mono);color:var(--ft)}
.tw{border:1px solid var(--ln);border-radius:6px;overflow:auto;background:var(--p)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font:500 11px var(--mono);color:var(--ft);padding:6px 8px;border-bottom:1px solid var(--ln);background:var(--p2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #30363d99;color:var(--dim);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.t{color:var(--tx)}td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}td.n{color:var(--tx)}td.mm{font-family:var(--mono);white-space:nowrap}
tr.r{cursor:pointer}tr.r:hover td{background:#ffffff06}
tr.g td{background:var(--bg);color:var(--tx);font:600 12px var(--mono)}
.ok{color:var(--gr)}.wa{color:var(--am)}.bad{color:var(--rd)}.ft{color:var(--ft)}.tx{color:var(--tx)}.dim{color:var(--dim)}
.s{font:12px var(--mono)}
.btn{font:500 11.5px var(--mono);padding:2px 9px;border-radius:4px;border:1px solid var(--ln2);background:var(--p2);color:var(--tx);cursor:pointer;white-space:nowrap;display:inline-block;line-height:18px}
.btn:hover{border-color:var(--ft)}.btn.g{background:transparent;border-color:transparent;color:var(--ft)}.btn.g:hover{color:var(--tx);border-color:var(--ln2)}
.btn.danger{color:var(--rd);border-color:#f8514966}
.btn+.btn,.btn+a,a+.btn{margin-left:4px}
.mb{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end}
select,input{background:var(--bg);border:1px solid var(--ln2);border-radius:4px;color:var(--tx);font:12px var(--mono);padding:2px 6px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.seg span{padding:2px 9px;font:11.5px var(--mono);color:var(--dim);cursor:pointer;border-right:1px solid var(--ln);white-space:nowrap}
.seg span:last-child{border:0}.seg span.on{background:var(--p2);color:var(--tx)}
/* agent state glyphs: shape + colour */
.st{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);white-space:nowrap}
.gy{display:inline-block;flex:none;width:9px;height:9px}
.gy.working{background:var(--gr);border-radius:50%}
.gy.waiting-agent{border:2px solid var(--dim);border-radius:50%}
.gy.waiting-you{background:var(--am);transform:rotate(45deg);width:8px;height:8px;animation:pulse 2.4s ease-in-out infinite}
.gy.idle{border:1.5px solid var(--ft);border-radius:50%}
.gy.error{background:var(--rd);border-radius:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6;box-shadow:0 0 6px var(--am)}}
.c-working{color:var(--gr)}.c-waiting-agent{color:var(--dim)}.c-waiting-you{color:var(--am)}.c-idle{color:var(--ft)}.c-error{color:var(--rd)}
.tsx{font:11px var(--mono);padding:0 6px;border-radius:10px;border:1px solid;white-space:nowrap}
.ts-planned{color:var(--dim);border-color:var(--ln2)}.ts-progress{color:var(--bl);border-color:#4493f866}.ts-review{color:var(--pu);border-color:#a371f766}.ts-blocked{color:var(--rd);border-color:#f8514966}.ts-done{color:var(--gr);border-color:#3fb95066}.ts-held{color:#9cb4d8;border-color:#9cb4d866}
.pri{font:600 11px var(--mono);border:1px solid var(--ln2);border-radius:10px;padding:0 6px;background:var(--bg);color:var(--tx)}
.pri.p0{border-color:var(--tx)}
.ref{font:12px var(--mono);color:var(--dim);white-space:nowrap}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--ln);border-radius:6px;background:var(--p);overflow:hidden}
.k{padding:7px 11px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);min-width:0;margin:0 -1px -1px 0}
.k span{display:block;font:11px var(--mono);color:var(--ft)}
.k b{font:500 18px var(--mono);display:block;line-height:1.3}
.k small{font:11px var(--mono);color:var(--ft);display:block;line-height:1.35}
/* cto strip */
.ctos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);border:1px solid #4493f866;border-radius:6px;background:var(--p);margin-top:10px;cursor:pointer}
.ctos:hover{border-color:var(--bl)}
.ctos>div{padding:7px 11px;border-right:1px solid var(--ln);min-width:0}.ctos>div:last-child{border:0}
.ctos .lbl{display:block;font:11px var(--mono);color:var(--ft)}
.ctos .v{font:12.5px var(--mono);color:var(--tx)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:10px}
.ac{border:1px solid var(--ln);border-left:3px solid var(--ln);border-radius:6px;background:var(--p);padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.ac:hover{border-color:var(--ln2)}
.ac.working{border-left-color:var(--gr)}.ac.waiting-agent{border-left-color:var(--dim)}.ac.waiting-you{border-left-color:var(--am);background:linear-gradient(90deg,#e3b34110,var(--p) 30%)}.ac.error{border-left-color:var(--rd)}
.ac .h{display:flex;gap:8px;align-items:center;min-width:0}
.ac .h b{font:600 14px var(--mono)}
.ac .h .role{font:11.5px var(--mono);color:var(--dim)}
.ac .h .st{margin-left:auto}
.ml{display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 8px;font:11.5px var(--mono);color:var(--dim)}
.ml span{color:var(--ft)}
.ctxbar{display:inline-block;width:46px;height:5px;border-radius:3px;background:var(--ln);vertical-align:middle;position:relative;overflow:hidden;margin:0 4px}
.ctxbar i{position:absolute;left:0;top:0;bottom:0}
.work{font-size:13px;color:var(--tx);line-height:1.35;height:35px;overflow:hidden}
.work .lnk{font:11.5px var(--mono);color:var(--ft)}
.stepl{font:12px var(--mono);color:var(--tx);display:flex;gap:8px;align-items:baseline;min-width:0}
.stepl .n{color:var(--ft);margin-left:auto;white-space:nowrap}
.segs{display:flex;gap:2px;height:7px;margin-top:3px}
.segs i{flex:1;border-radius:2px;background:var(--ln)}
.segs i.d{background:#3fb95099}.segs i.c{background:var(--bl)}.segs i.c.waiting-agent{background:var(--dim)}.segs i.c.waiting-you{background:var(--am)}.segs i.x{background:repeating-linear-gradient(90deg,#3d444d 0 3px,transparent 3px 6px)}.segs i.o{background:transparent;border:1px dashed var(--ln2)}
.lb{font:11.5px var(--mono);color:var(--dim);height:17px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.why{font:12px var(--mono);min-height:34px;line-height:1.4}
.foot{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font:11px var(--mono);color:var(--ft);border-top:1px solid #30363d88;padding-top:5px}
.foot b{color:var(--dim);font-weight:500;display:block}
.feed{border:1px solid var(--ln);border-radius:6px;background:var(--p)}
.fe{display:grid;grid-template-columns:50px 96px minmax(0,1fr);gap:8px;padding:5px 10px;border-bottom:1px solid #30363d77;font:12px var(--mono);color:var(--dim)}
.fe:last-child{border:0}
.fe .t{color:var(--ft)}.w-agent{color:var(--bl)}.w-cto{color:var(--pu)}.w-sys{color:var(--ft)}
/* loops */
.lpg{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px}
.lpi{padding:8px 10px;border-bottom:1px solid var(--ln);cursor:pointer}
.lpi.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--bl)}
.lpi b{font:600 12.5px var(--sans)}.lpi .id{font:11px var(--mono);color:var(--ft);margin-left:4px}
.lpi small{display:block;font:11px var(--mono);color:var(--ft)}
.box{border:1px solid var(--ln);border-radius:6px;background:var(--p);padding:9px 11px;min-width:0}
.box h3{font:600 12.5px var(--sans)}
.box .sub{font:11.5px var(--mono);color:var(--ft);margin:1px 0 4px}
.chart{display:block;width:100%;height:auto}
.chart text{font:11px var(--mono);fill:var(--ft)}
.lg{display:flex;gap:12px;font:11.5px var(--mono);color:var(--dim);flex-wrap:wrap;margin-top:4px}.lg i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.grid{border-collapse:separate;border-spacing:3px;width:auto}
.grid th{background:transparent;border:0;font:11px var(--mono);color:var(--ft);padding:2px 4px;text-align:center}
.grid td{border:0;padding:0;text-align:center;vertical-align:middle}
.cell{font:11px var(--mono);border:1px solid var(--ln);border-radius:4px;padding:2px 3px;min-width:52px;white-space:nowrap}
.cell.ok{border-color:#3fb95066;color:var(--tx)}.cell.fail{border-color:#f8514988;color:var(--rd)}.cell.chg{border-color:var(--ln2);color:var(--dim);border-style:dotted}
.cell.now{border-color:var(--bl);background:#4493f822;color:var(--tx)}.cell.now.waiting-agent,.cell.now.parked{border-color:var(--dim);background:#b1bac414}.cell.now.waiting-you{border-color:var(--am);background:#e3b34122}
.cell.skip{border-style:dashed;color:var(--ft)}.cell.empty{border-color:transparent}
.rowh{font:11px var(--mono);color:var(--ft);text-align:right!important;white-space:nowrap;padding-right:6px!important}
.rowh .why2{color:var(--dim)}
.rowh{white-space:normal!important;max-width:170px;line-height:1.3}
@media (max-width:1300px){.lpg{grid-template-columns:200px minmax(0,1fr)}}
.ctr{font:11px var(--mono);color:var(--ft);white-space:nowrap;padding-left:6px!important}
.tline{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:3px 0}
.tline .lab{font:11px var(--mono);color:var(--ft);width:150px;text-align:right;padding-right:6px}
/* boards */
.stack{display:flex;height:16px;border-radius:3px;overflow:hidden;min-width:180px}
.stack i{display:block;height:100%;font:600 10px/16px var(--mono);color:#0d1117;text-align:center;overflow:hidden;font-style:normal}
.ghp{border:1px solid var(--ln);border-radius:6px;background:var(--bg)}
.ghp-h{display:flex;align-items:center;gap:10px;padding:10px 14px 0;flex-wrap:wrap}
.ghp-h .t{font:600 16px var(--sans)}.ghp-h .t small{font:400 13px var(--sans);color:var(--ft);margin-left:4px}
.ghv{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--ln)}
.ghv span{padding:6px 12px;font-size:13px;color:var(--dim);cursor:pointer;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;margin-bottom:-1px;white-space:nowrap}
.ghv span.on{color:var(--tx);border-color:var(--ln);background:var(--bg)}
.ghf{display:flex;gap:8px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.ghf .fi{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--ft)}
.ghb{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px}
.ghc{background:var(--p);border:1px solid var(--ln);border-radius:8px;min-height:420px;display:flex;flex-direction:column;flex:1 0 220px;min-width:220px}
.ghc .h{padding:8px 10px 4px}
.ghc .h .r1{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.ghc .h .cnt{font:500 12px var(--sans);color:var(--dim);background:var(--p2);border-radius:10px;padding:0 7px}
.ghc .h .cnt.over{background:#f8514933;color:var(--rd)}
.ghc .h .desc{font-size:12px;color:var(--ft);margin-top:2px}
.ghc .b{padding:4px 8px;flex:1;overflow:auto}
.ghc .add{padding:6px 10px;color:var(--ft);font-size:13px;border-top:1px solid var(--ln)}
.sdot{width:12px;height:12px;border-radius:50%;border:2px solid;display:inline-block;flex:none}
.gi{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.gi:hover{border-color:var(--ln2)}
.gi.gneed,.gi.gyou{border-left:3px solid var(--am)}.gi.gblk{border-left:3px solid var(--rd)}.gi.gheld{border-left:3px solid #9cb4d8}.gi.gfail{border-left:3px solid var(--rd)}
.gi .r1{display:flex;gap:6px;align-items:center;font:12px var(--mono);color:var(--ft)}
.gi .r1 .age{margin-left:auto}
.gi .tt{font-size:14px;font-weight:600;color:var(--tx);margin:3px 0 6px;line-height:1.3}
.gi .lbls{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.gl{font:500 12px var(--sans);padding:0 7px;border-radius:12px;border:1px solid;line-height:18px}
.gi .fl{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.gf{font:11.5px var(--mono);color:var(--dim);border:1px solid var(--ln);border-radius:10px;padding:0 6px;line-height:18px}
.gf.ag{color:var(--tx)}
.gi .act{font:11.5px var(--mono);margin-top:6px;line-height:1.4}
.ico{display:inline-grid;place-items:center;width:16px;height:16px;flex:none}
/* cto */
.anch{position:sticky;top:-12px;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--ln);margin-bottom:4px}
.anch a{font:12px var(--mono);border:1px solid var(--ln);border-radius:12px;padding:1px 10px;color:var(--dim)}
.anch a b{color:var(--tx);font-weight:500}
.need{border-bottom:1px solid var(--ln);padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.need:last-child{border:0}
.need .ttl{font-weight:600;color:var(--tx);font-size:13.5px}
.need .ttl .tag{font:600 10.5px var(--mono);color:var(--ft);border:1px solid var(--ln2);border-radius:3px;padding:0 4px;margin-right:6px;vertical-align:1px}
.need .meta2{font:11.5px var(--mono);color:var(--ft)}
.need .esc{font:11.5px var(--mono);color:var(--dim);margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:6px}
.opt{border:1px solid var(--ln2);border-radius:5px;padding:5px 8px;font-size:12.5px;cursor:pointer;background:var(--p2)}
.opt:hover{border-color:var(--ft)}
.opt .oh{display:flex;gap:6px;align-items:baseline}
.opt .oh b{font:600 12px var(--mono)}
.opt .oh .pick{margin-left:auto;font:11px var(--mono);color:var(--tx);white-space:nowrap}
.opt.rec{border-color:var(--dim)}
.opt small{display:block;font:11px var(--mono);color:var(--ft);margin-top:2px}
.conf{font:11.5px var(--mono);color:var(--dim);margin-top:5px}
.imp{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ln)}
.imp:last-child{border:0}
.imp .n{font:600 14px var(--mono);color:var(--bl)}
.imp small{display:block;font:11.5px var(--mono);color:var(--ft)}
.hb{display:inline-block;width:80px;height:6px;border-radius:3px;background:var(--ln);position:relative;overflow:hidden;vertical-align:middle;margin-right:6px}
.hb i{position:absolute;left:0;top:0;bottom:0}
details.scr{border:1px solid var(--ln);border-radius:6px;background:var(--p);margin-top:8px}
details.scr summary{padding:6px 10px;font:12px var(--mono);color:var(--dim);cursor:pointer}
.scratch{font:12px/1.65 var(--mono);color:var(--dim);padding:4px 10px 10px;white-space:pre-wrap}
/* config */
.code{font:12px/1.6 var(--mono);background:var(--bg2);border:1px solid var(--ln);border-radius:6px;overflow:auto;height:calc(100vh - 150px);display:grid;grid-template-columns:auto 1fr;position:sticky;top:0}
.code .ln{color:#484f58;text-align:right;padding:8px 8px 8px 10px;user-select:none;border-right:1px solid var(--ln)}
.code .tx2{padding:8px 12px;color:var(--dim);white-space:pre}
.yk{color:#79c0ff}.yv{color:#a5d6ff}.yc{color:#8b949e}
.form{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:12.5px}
.form input,.form select{width:100%}
.tog{display:inline-block;width:26px;height:14px;border-radius:7px;background:var(--dim);position:relative;vertical-align:middle;cursor:pointer}
.tog:after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#0d1117}
.tog.off{background:var(--ln2)}.tog.off:after{right:auto;left:2px}
.gloss dt{font:600 12px var(--mono);color:var(--tx);margin-top:8px}
.gloss dd{font-size:12.5px;color:var(--dim);margin-left:0}
.gloss code{font:12px var(--mono);color:#a5d6ff}
/* dock */
.dock{grid-row:3;grid-column:2;display:flex;flex-direction:column;background:var(--p);min-height:0;min-width:0;overflow:hidden}
.dock header{padding:8px 12px;border-bottom:1px solid var(--ln);font:600 12.5px var(--mono);display:flex;gap:8px;align-items:center;white-space:nowrap}
.dock header small{font-weight:400;color:var(--ft)}
.dock header .btn,.hdr .tab,.nu,.clock{flex:none}.dock header .sp{min-width:0}
.pins{border-bottom:1px solid var(--ln);background:var(--bg);max-height:62%;overflow-y:auto;overflow-x:hidden}

 <h2 id="glossary">glossary &amp; data model <span>how every state and number is defined</span></h2>
 <div class="box gloss"><dl>
 <dt>entities</dt><dd><code>account</code> · <code>host</code> · <code>repo</code> (+ GitHub project, goal) · <code>agent</code> (one role, one repo, one account, one host) · <code>session</code> (one CLI process) · <code>ticket</code> (GitHub issue; its PR is attached) · <code>run</code> (one agent working one ticket through a loop) · <code>pr record</code> (a merged PR with its loop-back counts, phases, cost) · <code>event</code> · <code>escalation</code> · <code>rule</code> · <code>watch</code> · <code>incident</code> · <code>tool-call aggregate</code>. Every number on screen is computed from these and GitHub.</dd>
 <dt>ticket · PR</dt><dd>Written <code>repo#n</code>. A PR is shown as <code>PR #n</code> on its issue and never as its own card; PR cost and loop-backs roll up to the issue.</dd>
 <dt>ticket states</dt><dd>Each project's Status options map to <code>planned · in progress · review · blocked · done</code> via <code>status_map</code>. <b>in progress</b> = being implemented. <b>review</b> = PR open (from the PR's created time). <b>blocked</b> = needs someone outside the agent loop; amber when that someone is you. <b>WIP</b> = in progress + review. A column limit (e.g. <code>1 / 3</code> = 1 item, limit 3) applies to that Status column only.</dd>
 <dt>goal</dt><dd>What a repo is driving towards: a GitHub milestone, an epic (via sub-issues) or an iteration. Its "left" counts only issues in the goal; the board counts every open issue.</dd>
 <dt>held · merge held</dt><dd><b>held</b> = the <code>held_label</code> on an issue, set by the CTO or you; agents won't start it; the Status is unchanged. <b>merge held</b> = a PR that may not merge until a decision is made.</dd>
 <dt>runs: active · queued · parked</dt><dd>An agent has at most one <b>active</b> run. <b>queued</b> = waiting for this agent's own active run to finish (e.g. a fix it will do next). <b>parked</b> = waiting on another agent or a PR check (e.g. a PR in QA). Neither uses the agent's time.</dd>
 <dt>agent states</dt><dd><code>working</code> active run progressing · <code>waiting on agent</code> no active run, only queued/parked ones · <code>waiting on you</code> active run needs an escalation answered · <code>idle</code> no runs · <code>error</code> crashed or stalled.</dd>
 <dt>durations</dt><dd><b>in state</b> = since the agent's state last changed · <b>in step</b> = since the run entered its current step · <b>in status</b> = since the ticket's Status last changed · <b>held for</b> = since the held label was added · <b>age</b> = since the session started.</dd>
 <dt>loop · step · side step · edge · attempt · rework</dt><dd>A loop is a main line of steps plus <b>side steps</b> (fix, report-bug, retest) reached only through an <b>edge</b>. Each edge fires on a <b>signal</b> (e.g. <code>ci:fail</code>, <code>review:changes_requested</code>). Edges flagged <code>rework</code> count as rework; rework is counted on the delivering loop only (QA's bug report is the developer's rework, not QA's). <b>attempt</b> = 1 + rework edges taken on this run. <b>step n/N</b> counts main steps only. "↺ n on them" = loop-backs taken on runs in flight.</dd>
 <dt>windows</dt><dd><b>24h</b> = the last 24 hours rolling. <b>7d</b> / <b>14d</b> = rolling days. A chart's last bar is the last 24h. "% of claude-main 7d" = share of that account's current 7d window.</dd>
 <dt>limits</dt><dd>Usage is <b>sampled</b> every 30m (claude: statusline; codex: app-server). <b>projected at reset</b> = latest sample + last-24h pace × hours to reset. <b>alert_at</b>, <b>stop_at</b> and the over-100% watch fire on the first sample that crosses them. <b>alert_at</b> notifies you (digest). <b>stop_at</b> stops new runs on that account; running runs finish. A projection "≈ with X moved" adds the 24h tokens of agents switching onto the account from their switch time, converted with the receiving account's tokens-per-% from its last 24h — an estimate (vendor weighting and model mix ignored); "once X switch away" splits the source account's pace by its agents' tokens and stops each at its switch time. The samples are the source of truth for limits; tokens are only used for these estimates. The 5h window starts at first use and resets 5h later.</dd>
 <dt>escalations</dt><dd><b>urgency</b> now / soon / later decides the channel (Config → escalation). <b>★ cto pick</b> = the option the CTO recommends; <b>conf</b> = its confidence in that pick. A <b>proposal</b> is a suggestion with nothing blocked yet.</dd>
 <dt>branch app</dt><dd>A PR's branch running on the host (e.g. <code>my-mac.local:5181</code>) so you can click through it before merge — "try app". The CTO starts it when the PR opens; QA's <code>start-app</code> restarts it with test data. The optional <code>your-test</code> step waits for your pass/fail on it.</dd>
 <dt>ETA</dt><dd>Goal issues left ÷ issues closed per day over the last 7 days, rounded up to whole days.</dd>
 <dt>$</dt><dd>API-equivalent: tokens × <code>rates</code>[model]. Subscriptions are not billed per token. <b>$ / merge (all agents)</b> = every agent's $ ÷ merged PRs. <b>dev $ / merge</b> = that developer's $ ÷ its merged PRs.</dd>
 <dt>KPIs</dt><dd><b>lead time</b> branch → merge (mean) = coding (branch → PR open) + pickup (PR open → first review) + review + rework + qa + merge · <b>first-pass review</b> merged PRs with no review→fix ÷ merged PRs · <b>rework / merged PR</b> rework edges on merged PRs ÷ merged PRs · <b>change failure</b> merged PRs that needed a follow-up fix ÷ merged PRs · <b>autonomy rate</b> merged PRs with no human commit ÷ merged PRs · <b>intervention rate</b> sessions you typed into ÷ sessions · <b>wasted run</b> a run that ended without progress (reset or abandoned) · <b>time to answer</b> escalation raised → your answer (mean) · <b>busy</b> hours with an active, progressing run.</dd>
 <dt>symbols</dt><dd>ⓔ = actor outside Control Centre (GitHub, review bot) · <code>monitor</code> = Control Centre's threshold checks · ⏸ = waiting / held · ★ = CTO pick.</dd>
 </dl></div>
 </div></div>`}
function addRepo(){const gh=$('#nr-gh').value.trim();if(!gh)return;const id=gh.split('/').pop();if(repoOf(id))return;const opts=['Todo','In Progress','Review','Done'];
 $('#maparea').innerHTML=`<div class="box" style="margin-top:6px"><div class="s tx">found project #${$('#nr-pn').value||'?'} on ${gh} · Status options: ${opts.join(', ')}</div><div class="form" style="margin-top:6px">${opts.map((o,i)=>`<span>"${o}" means</span><select class="mapsel">${CONFIG.states.map((t,j)=>`<option ${[0,1,2,4][i]==j?'selected':''}>${t}</option>`).join('')}</select>`).join('')}<span></span><span><span class="btn" onclick="confirmRepo('${gh}','${id}')">save repo</span></span></div></div>`}
function confirmRepo(gh,id){const opts=['Todo','In Progress','Review','Done'],maps=$$('.mapsel').map(s=>s.value),cols=['#8b949e','#4493f8','#a371f7','#3fb950'];CONFIG.repos.push({id,gh,color:'#ffa657',project:{number:+$('#nr-pn').value||4,title:id+' board',status:opts.map((n,i)=>({n,c:cols[i],d:'',map:maps[i]})),fields:['Priority','Size'],views:['Board','Table']},goal:null,loopOverrides:[]});DAILY[id]=Array(14).fill(0);say(`connected ${id}. No agents assigned yet — add one, or ask me to propose agents.`,'main');renderAll();go('config')}
function addAgent(){const ro=$('#na-ro').value,id=($('#na-id').value||$('#na-id').placeholder).trim();if(agentOf(id))return;CONFIG.agents.push({id,role:ro,repo:$('#na-rp').value,account:$('#na-ac').value,model:$('#na-md').value,host:CONFIG.hosts[0].id});AGd(id);say(`added ${id} (${CONFIG.roles[ro].label}) on ${$('#na-rp').value}. Idle until I give it the top ticket on its board.`,'main');renderAll();go('config')}
function rmAgent(id){CONFIG.agents=CONFIG.agents.filter(a=>a.id!=id);renderAll();go('config')}

   ==================================================================== */
let thread='main';
const THREADS={main:{name:'all repos',msgs:[]}};
function seedMain(){const cx=w7(acct('codex-main')),cl=w7(acct('claude-main'));THREADS.main.msgs=[['you',clock(ago(1)),'status across all repos?'],['cto',clock(ago(1)),{table:[['repo','goal','now'],...CONFIG.repos.map(r=>[r.id,r.goal?`${goalDone(r.id)}/${goalScope(r.id)} · eta ${dayOnly(eta(r.id))}`:'no board',(CTO.important.find(i=>i[0].startsWith(r.id+'#'))||[0,'—'])[1]])],after:`Limits: claude-main 7d ${cl.used}% → ${winPace(cl)}% at reset. codex-main 7d ${cx.used}% → ${winPace(cx)}%; ${fallbackAgents('codex-main').map(x=>x.id).join(' + ')} move to claude-main from their next new run, leaving codex ≈${projIfMoved(acct('codex-main'))}% at reset; it would stop at ${acct('codex-main').stopAt}% ≈ ${clock(stopForecast(acct('codex-main')))} only if nothing moved. ${openBR().length} items need you (pinned above).`}]]}
function drawPins(){const o=openBR(),onCto=$('#v-cto').classList.contains('on');$('#pins').style.display=onCto?'none':'';
 $('#pins').innerHTML=`<div class="part">needs you · ${o.length}<span class="sp"></span>most urgent first</div>`+o.map(b=>`<div class="pin ${b.urg=='later'?'lo':''}"><div class="h"><b class="tx" style="font-weight:600">${b.kind}</b> · ${b.urg} · ${b.repo} · ${dur(minsSince(b.at))}</div><div class="t" title="${esc(b.rule)}">${b.title}</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px">${b.opts.map(x=>`<span class="btn" title="${esc(x[0]+': '+x[1]+' — '+x[2])}" onclick="decide('${b.id}','${x[0]}')">${x[0]}${x[4]&&b.kind!='action'?' ★':''}</span>`).join('')}<span class="btn g" onclick="discuss('${b.id}')">discuss</span><span class="btn g" onclick="brief('${b.id}')">details</span></div></div>`).join('')}
function ensureThread(id){if(THREADS[id])return;const b=brById(id);THREADS[id]={name:b.title.slice(0,38)+'…',msgs:[['cto','now',`Thread for: ${b.title}. ${b.raised} is in this thread. Options: ${b.opts.map(o=>o[0]+' '+o[1]).join(' · ')}`]]};if(id=='b-adr'){THREADS[id].msgs.push(['research-2','now','ADR-12 aligns every property row to 28px. An 8-line box pushes the rows below it down while you type.']);THREADS[id].msgs.push(['dev-2','now','Rows only move while the box has focus; it collapses back on blur. Try it at my-mac.local:8091 (PR #1709 branch app).']);THREADS[id].msgs.push(['cto','now','Option C (cap at 3 lines in the properties pane) keeps most of UX7 and limits the shift. I still recommend A.',['choose A','choose C','choose B']])}}
function drawTh(){const Tt=THREADS[thread];$('#scope').innerHTML=`thread: <b class="tx">${Tt.name}</b>${thread!='main'?` · <a onclick="thread='main';drawTh()">all repos</a>`:''}<span class="sp"></span>${Object.keys(THREADS).length>1?`<select onchange="thread=this.value;drawTh()">${Object.entries(THREADS).map(([k,v])=>`<option value="${k}" ${k==thread?'selected':''}>${v.name}</option>`).join('')}</select>`:''}`;
 $('#thread').innerHTML=Tt.msgs.map(([w,t,m,b])=>`<div class="mg ${w=='you'?'me':w=='cto'?'':'ag'}"><div class="h"><b>${w}</b> ${t}</div>${typeof m=='object'?`<table>${m.table.map((r,i)=>`<tr>${r.map(c=>i?`<td>${linkify(String(c))}</td>`:`<th>${c}</th>`).join('')}</tr>`).join('')}</table><p style="margin-top:4px">${m.after}</p>`:`<p>${linkify(m)}</p>`}${b?`<div class="bt">${b.map(x=>`<span class="btn" onclick="decide('${thread}','${x.slice(-1)}')">${x}</span>`).join('')}</div>`:''}</div>`).join('');$('#thread').scrollTop=1e6}
function say(m,th){(THREADS[th||thread]||THREADS.main).msgs.push(['cto','now',m]);drawTh()}
function decide(id,o){const b=brById(id);if(!b||b.done)return;const op=b.opts.find(x=>x[0]==o);if(!confirm(`${b.kind}: ${b.title}\n\nChoose ${o}: ${op[1]}?\nWhat happens: ${op[2]}`))return;b.done=1;ensureThread(id);THREADS[id].msgs.push(['you','now',`${o}: ${op[1]}`]);THREADS[id].msgs.push(['cto','now',`Doing it: ${op[2]}. Agents told; logged.`]);thread=id;toast(`${b.kind} answered: ${o} · <a onclick="brById('${id}').done=0;renderAll();toast('decision undone')">undo</a>`);renderAll()}
function discuss(id){ensureThread(id);thread=id;openDock();drawTh()}
function brief(id){go('cto');setTimeout(()=>{document.getElementById('c-needs').scrollIntoView()},30);discuss(id)}
function chatAbout(aid){thread='ag-'+aid;if(!THREADS[thread])THREADS[thread]={name:'about '+aid,msgs:[['cto','now',`What do you want to know about ${aid}? It is ${SL[agentState(aid)]}${activeRun(aid)&&activeRun(aid).ticket?' on '+activeRun(aid).ticket:''}.`]]};openDock();drawTh()}
function openDock(){$('#app').classList.remove('nodock')}
function toggleDock(){$('#app').classList.toggle('nodock')}
const SLASH=[['/priority','shop-app#3633 P1','set a ticket\'s priority (writes to GitHub)'],['/assign','shop-app#3624 dev-1','give a ticket to an agent'],['/try','PR #3830','open the branch app for a PR'],['/pause','dev-2','pause an agent after its current step'],['/hire','qa site-builder','propose a new agent (asks before spending)'],['/digest','','summary since you were last here']];
$('#cin').addEventListener('input',e=>{const v=e.target.value;const m=v.startsWith('/')?SLASH.filter(s=>s[0].startsWith(v.split(' ')[0])):[];$('#slash').style.display=m.length?'block':'none';$('#slash').innerHTML=m.map(s=>`<div><b>${s[0]}</b> <span>${s[1]} — ${s[2]}</span></div>`).join('')});
$('#cin').addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.value.trim()){const v=e.target.value.trim().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));THREADS[thread].msgs.push(['you','now',v]);e.target.value='';$('#slash').style.display='none';
 const r=v.startsWith('/priority')?`${v.split(' ')[1]} → ${v.split(' ')[2]}. Written to GitHub; agents pick by priority.`:v.startsWith('/try')?`The branch app for ${v.split(' ').slice(1).join(' ')} is at my-mac.local:5181.`:v.startsWith('/pause')?`${v.split(' ')[1]} will pause after its current step.`:'(prototype — the real CTO session answers here)';setTimeout(()=>say(r),200);drawTh()}});

function renderAll(){_evx=null;renderChrome();renderAgents();renderLoops();renderBoards();renderCTO();renderMetrics();renderConfig();drawPins();drawTh()}
function go(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id=='v-'+v));$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v==v));$('#main').scrollTop=0;closeD();drawPins()}
$$('.tab').forEach(t=>t.onclick=()=>go(t.dataset.v));
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key=='Escape')closeD();if(e.key=='\\')toggleDock();if($('#drw').classList.contains('on')&&$('#drw').dataset.id){if(e.key=='j')nav(1);if(e.key=='k')nav(-1)}});
if(innerWidth<1280)$('#app').classList.add('nodock');
seedMain();renderAll();
